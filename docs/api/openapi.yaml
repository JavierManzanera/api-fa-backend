openapi: 3.1.0
info:
  title: api-fa-backend — Reusable Hardened Auth Service
  description: >-
    API-First contract for the reusable FastAPI auth starter ("bloque hiperseguro").
    This file is the full source of truth for all HTTP-facing behavior — it documents
    both the endpoints already implemented (register/login/forgot-password/verify-otp/
    reset-password/refresh) and the OBJ-001 remediation surface (JWT type confusion,
    OTP brute-force hardening, rate limiting), plus the OBJ-002 remediation surface
    (session/token lifecycle: `/auth/logout`, refresh-token rotation with reuse
    detection, and `token_version`-based invalidation on password reset — closes
    audit finding #3), plus the OBJ-003 remediation surface (data & transport
    hardening: OTP hashed at rest, TLS to PostgreSQL, constant-time `/login` and
    `/forgot-password` — closes audit findings #5, #7, #8), plus the OBJ-004
    remediation surface (HTTP security baseline: CORS policy, HSTS/X-Frame-Options/
    CSP/nosniff security headers, `ENVIRONMENT`-gated `/docs`/`/redoc`/`/openapi.json`,
    structured auth-event logging, removal of the OTP debug `print`, and
    `X-Forwarded-For`-aware rate-limiter client-IP resolution — closes audit findings
    #9, #10, #13), plus the OBJ-005 remediation surface (email verification flow:
    a real `POST /auth/verify-email` + `POST /auth/resend-verification-email`,
    `is_verified` enforcement at `/auth/login` and `/auth/refresh`, and a pluggable
    `EmailSender` abstraction replacing the print-based mock — closes audit finding
    #11), plus the OBJ-007 remediation surface (registration anti-enumeration:
    `POST /auth/register` no longer returns a distinguishable `400` for an
    already-registered email — it now always returns the same generic `200`/
    `MessageResponse` shape used by `/auth/forgot-password` and
    `/auth/resend-verification-email`, closes audit finding #6). Config/startup-only
    or transport-layer requirements that have no HTTP surface (SECRET_KEY
    validation, PostgreSQL TLS enforcement, CORS/security-headers middleware,
    environment gating, audit logging, `EmailSender` provider selection, and —
    as of OBJ-007 — the server-side "you already have an account" notification
    email and the bcrypt-cost timing-parity requirement on `/auth/register`) are
    intentionally NOT modeled here — see `docs/api/obj-001-design-
    notes.md` §4, `docs/api/obj-003-design-notes.md` §2, `docs/api/obj-004-design-
    notes.md` (full document), `docs/api/obj-005-design-notes.md` (full document),
    and `docs/api/obj-007-design-notes.md` (full document).
    Session/token persistence design (the `refresh_sessions` table, reuse-detection
    state machine, `token_version` claim) is documented in
    `docs/api/obj-002-design-notes.md`. **Note on finding numbers:** `obj-003-design-
    notes.md` §0 documents a transposition between the finding numbers cited in
    `dependency_graph.md`'s OBJ-003 row and `docs/security/audit-report.md`'s actual
    numbering — #5/#7/#8 as used throughout this file follow the audit report's real
    numbering (#5 = timing side-channel, #7 = OTP plaintext, #8 = no TLS), not the
    dependency graph's (as-yet-uncorrected) citation. OBJ-004's #9/#10/#13 citation was
    independently verified against `audit-report.md` and found correct, no transposition
    (`obj-004-design-notes.md` §0). OBJ-005's #11 citation was independently verified
    against `audit-report.md` and found correct (`obj-005-design-notes.md` §0).
  version: "0.7.0-obj-007"
  contact:
    name: solution-architect (PRJ-003)
servers:
  - url: /api/v1
    description: Versioned API root (matches `settings.API_V1_STR`)

tags:
  - name: auth
    description: >-
      Owns all identity/credential/session data for this service (users, verification
      codes, tokens, and — as of OBJ-002 — the `refresh_sessions` table tracking
      active/rotated/revoked refresh-token lineage). No other module in this template
      owns auth-related persistence — any forked project extending this template
      should keep it that way.

security: []  # default: unauthenticated. Individual operations opt into `bearerAuth`.

paths:
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register — or, if the email is already registered, silently notify its owner
      description: >-
        **Changed by OBJ-007 (Gate 1 decision, 2026-08-25; closes audit finding #6).**
        Response shape and status code are now IDENTICAL regardless of whether
        `user_in.email` was already registered — the explicit `400` this endpoint
        used to return for a duplicate email is gone. This mirrors
        `/auth/forgot-password` and `/auth/resend-verification-email` exactly: a
        generic `200`/`MessageResponse`, chosen for consistency per
        `obj-007-design-notes.md` §1 rather than inventing a third response
        pattern. Because the response body can no longer safely carry the created
        user's actual data (returning it only on the new-account branch would
        itself be the distinguishing signal), this endpoint **no longer returns
        `UserResponse`/`201`** — that would have required either leaking real
        account state on the duplicate-email branch or fabricating fake user data,
        both rejected. See `obj-007-design-notes.md` §1 for the full rationale.

        Branch behavior (server-side only — never signaled in the HTTP response):

        - **New email:** unchanged from OBJ-005 — a `User` row and a
          `purpose="email_verification"` `Verification` row are created, and a
          verification-code email is sent via the injected `EmailSender`.
        - **Already-registered email:** no `User`/`Verification` row is created or
          modified (still true, unchanged). Instead, an "already have an account"
          notification email is sent to that address via the same `EmailSender`
          — **not** a new verification code. See `obj-007-design-notes.md` §2.

        **Timing/cost parity (OBJ-007, `obj-007-design-notes.md` §3):** both
        branches must perform one bcrypt-cost operation and one outbound
        `EmailSender.send()` call before responding, so wall-clock response time
        does not distinguish "account created" from "email already registered" —
        the same principle `/auth/login` and `/auth/forgot-password` already apply
        via `security.verify_password_or_dummy` (see `obj-003-design-notes.md` §3.2),
        extended here to registration's bcrypt-hash (not bcrypt-verify) cost.

        **Failure mode (extends OBJ-005's Gate 1 decision 3 to both branches):** if
        the required outbound email fails to send on EITHER branch, the call fails
        `503` with an identical, branch-agnostic body. New-account branch: the
        entire registration is rolled back (no `User`/`Verification` row survives).
        Existing-account branch: nothing to roll back (no rows were ever created).
        See `obj-007-design-notes.md` §3.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: >-
            Always returned regardless of whether `user_in.email` was already
            registered (anti-enumeration — OBJ-007, closes audit finding #6). See
            `obj-007-design-notes.md` §1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                msg: "If this email is not already registered, we've sent you a verification code to complete your registration."
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: >-
            A required outbound email (the new-account verification code, or the
            existing-account "you already have an account" notification) could
            not be sent. Body is identical for both branches — see
            `obj-007-design-notes.md` §3.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Registration could not be completed because a required email could not be sent. Please try again."

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for an access/refresh token pair
      description: >-
        **Closed by OBJ-003 (finding #5).** Response codes and bodies below are
        unchanged — the fix is internal-only: a bcrypt password verification is now
        performed unconditionally on every call (against a precomputed dummy hash
        when the submitted email has no matching user), so the presence/absence of a
        matching account can no longer be inferred from whether a ~100-300ms bcrypt
        call ran. This is a best-effort, structurally-guaranteed mitigation (the
        expensive call always executes exactly once), not a response-time SLA —
        deliberately not expressed as a timing constraint at this contract layer. See
        `docs/api/obj-003-design-notes.md` §3.1 for the mechanism and §3.4 for how
        this should be tested (call-count assertions, not wall-clock timing).

        Both tokens returned here carry the explicit `type`
        claim from OBJ-001 (`access_token` decodes to `type=access`, `refresh_token`
        decodes to `type=refresh`).

        **Changed by OBJ-002 (finding #3).** Both tokens now also carry a `ver` claim
        set to the user's current `token_version` at issuance time (see
        `obj-002-design-notes.md` §3) — this is what lets a later password reset
        invalidate every token issued before it. The refresh token additionally
        carries a `jti` claim (a fresh UUID) that identifies a new row this call
        inserts into the `refresh_sessions` table, seeding a new token "family" — see
        `obj-002-design-notes.md` §1-2 for the persistence/rotation model that
        `/auth/refresh` and `/auth/logout` build on. Request/response shape is
        unchanged; only JWT payload contents and this new persistent side effect are
        new.

        **Changed by OBJ-004 (finding #10, informational only):** this endpoint now
        emits a structured `auth.login.success`/`auth.login.failure` audit-log event
        server-side (email, IP, outcome — never the password). No request/response
        contract change; see `obj-004-design-notes.md` §4.

        **Changed by OBJ-005 (finding #11).** An unverified user (`is_verified ==
        false`) with otherwise-correct credentials is now rejected — Gate 1 decision
        1 (block, Option A). Positioned after the bcrypt call (finding #5's
        structural guarantee is preserved) and after the existing `is_active`
        check, in the same `400` status family and same "business-state error"
        category as that existing check — a deliberate, precedented choice over a
        fully generic response; see `obj-005-design-notes.md` §3 for the full
        reasoning and the one-line alternative if the stricter fully-generic
        behavior is preferred instead.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginForm'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: Invalid credentials, inactive user, or unverified email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              examples:
                bad_credentials:
                  value: { detail: "Incorrect email or password" }
                inactive:
                  value: { detail: "Inactive user" }
                unverified:
                  value: { detail: "Email not verified" }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password-reset OTP
      description: >-
        **Changed by OBJ-001 (finding #2).** Response shape and the always-generic 200
        message are unchanged (anti-enumeration property preserved). New behavior:

        - IP-based rate limiting (429) — see `RateLimitError`.
        - A per-(email, purpose) issuance cooldown is enforced **silently**: a repeat
          request within the cooldown window for an email that already has a live,
          non-expired OTP still returns the same generic 200 and does **not** rotate
          the existing code or reset its `attempts` counter. No distinct status code
          or message is used for this case — introducing one would recreate the
          existence oracle this endpoint already avoids.
        - OTP generation moves from `random.choices` to `secrets`-based generation
          (implementation detail, not a contract change — see design notes §3).

        **Note (OBJ-002 boundary):** this endpoint only *issues* the OTP. The actual
        session-invalidation effect (bumping `token_version`, revoking active refresh
        sessions) happens on successful `/auth/reset-password` below, not here — an
        issued-but-unused OTP has no session-lifecycle side effect.

        **Closed by OBJ-003 (finding #5, plus finding #7):** the same generic-200
        response below is now also latency-equalized between the "email exists" and
        "email doesn't exist" branches (see `obj-003-design-notes.md` §3.2 for the
        chosen mechanism and the tradeoff it involved — not a response-shape change).
        Separately, the OTP this endpoint creates is now stored hashed (HMAC-SHA256)
        rather than in plaintext (finding #7) — an internal storage-format change with
        no effect on this endpoint's request/response contract; see
        `obj-003-design-notes.md` §1.

        **Changed by OBJ-004 (finding #10, informational only):** the debug `print`
        that previously wrote the raw OTP to stdout has been removed. OTP delivery now
        goes through a temporary placeholder seam (`app/core/notifications.py`) pending
        OBJ-005's real pluggable email-sender abstraction; a structured
        `auth.otp.requested` audit-log event is emitted instead (email, IP, purpose —
        never the OTP value itself). No request/response contract change; see
        `obj-004-design-notes.md` §5.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: >-
            Always returned regardless of whether the email exists (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                msg: "If the email exists, an OTP has been sent."
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Check an OTP without consuming it
      description: >-
        **Changed by OBJ-003 (finding #7, informational only):** the submitted OTP is
        now compared via a constant-time HMAC-digest check against a hashed value
        rather than a plaintext equality check — an internal storage/comparison
        change (`obj-003-design-notes.md` §1) with no effect on this endpoint's
        request/response contract or the failure-accounting behavior described below.

        **Changed by OBJ-001 (finding #2).** Success/failure response shape is
        unchanged. What changes is failure accounting: every failed check (wrong code,
        expired code, or no live code at all) increments the `attempts` counter on the
        active `Verification` row for that `(email, purpose)` pair — the **same**
        counter that `/auth/reset-password` increments on failure, since this endpoint
        is a free oracle against that row (audit finding #2). Once `attempts` reaches
        the configured maximum, the row is invalidated server-side (fail-closed) and
        every subsequent check — correct code or not — returns the identical 400 below
        until a new OTP is requested via `/auth/forgot-password`. There is deliberately
        **no distinct "locked out" response**: reusing the generic 400 prevents this
        endpoint from telling an attacker whether they hit the attempt cap or just
        guessed wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
      responses:
        '200':
          description: OTP is valid, unexpired, and not locked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                msg: "OTP verified successfully"
        '400':
          description: >-
            Invalid, expired, or attempt-locked-out OTP. All three cases are
            indistinguishable by design (see summary above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Invalid or expired OTP"
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Consume an OTP to set a new password
      description: >-
        **Changed by OBJ-003 (finding #7, informational only):** same constant-time
        HMAC-digest comparison change as `/auth/verify-otp` above — no contract effect.

        **Changed by OBJ-001 (finding #2).** Same failure-accounting change as
        `/auth/verify-otp` (shared `attempts` counter, identical fail-closed 400,
        no distinct lockout signal). Success path (OTP consumed, `Verification` row
        deleted) is unchanged.

        **Changed by OBJ-002 (finding #3).** On success, in the same transaction as
        the password update: `User.token_version` is incremented by 1, and every
        currently-active (`revoked_at IS NULL`) row in `refresh_sessions` for this
        user is marked revoked. Effect: every access token and every refresh token
        issued before this moment stops working — access tokens fail their `ver`
        check on their next use (no wait for natural expiry beyond that next request),
        and refresh tokens fail both the `ver` check *and* the session-revoked check
        on their next `/auth/refresh` call, whichever runs first. This closes audit
        finding #3's core scenario: a refresh token stolen before a suspicious
        password reset no longer survives the reset. See `obj-002-design-notes.md` §3
        for the full claim-comparison design and §2 for why reset also bulk-revokes
        `refresh_sessions` rather than relying on `token_version` alone. Response
        shape (`msg`) is unchanged — this is a same-transaction side effect, not a
        new field in the 200 body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Password updated; the OTP is consumed (deleted) and cannot be reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                msg: "Password updated successfully"
        '400':
          description: >-
            Invalid, expired, or attempt-locked-out OTP (indistinguishable — see
            `/auth/verify-otp`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Invalid or expired OTP"
        '404':
          description: >-
            OTP was valid but the user record no longer exists (deleted between
            `/forgot-password` and `/reset-password`). Unchanged edge case from
            existing code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "User not found"
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Consume an email-verification code to activate the account
      description: >-
        **New endpoint, OBJ-005 (finding #11).** Accepts the code the same way
        `/auth/verify-otp` does — same request schema, same rate-limit shape, same
        shared-attempts-budget/generic-`400` mechanism — but scoped to
        `purpose="email_verification"` (a disjoint budget from password-reset's
        `purpose="reset_password"`; a failed attempt on one never affects the
        other's counter). See `obj-005-design-notes.md` §1.1 and §2.1.

        Unlike `/auth/verify-otp` (check without consuming), this endpoint
        **consumes** the code on success: sets `User.is_verified = True` and
        deletes the `Verification` row — matching `/auth/reset-password`'s
        "consume and delete" pattern. A replayed code after success therefore
        falls into the same "no live row" branch as any other invalid code (no
        special-casing needed for reuse detection).

        Does **not** issue tokens — the response reports the updated user state
        only. Callers proceed to `/auth/login` normally afterward, which now
        succeeds since `is_verified` is `true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
      responses:
        '200':
          description: Email verified; `User.is_verified` is now `true`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: >-
            Invalid, expired, already-used, or attempt-locked-out verification
            code. All cases indistinguishable by design (same anti-oracle rule as
            `/auth/verify-otp`/`/auth/reset-password`), distinct message text from
            those endpoints (no cross-endpoint oracle — the two purposes never
            share a response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Invalid or expired verification code"
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/resend-verification-email:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Request a fresh email-verification code
      description: >-
        **New endpoint, OBJ-005 (finding #11), Gate 1 decision 5.** Mirrors
        `/auth/forgot-password`'s pattern almost exactly: IP+email rate limiting,
        a silent resend cooldown, and an always-generic `200` response regardless
        of whether the email exists — deliberately unauthenticated (no
        `Authorization` header) so a user who lost their session before verifying
        can still request a fresh code. See `obj-005-design-notes.md` §2.2.

        If the account is already verified, this is a silent no-op (same generic
        `200`, no new code generated, no email sent) — avoids both an
        already-verified-user oracle and an unwanted "already verified" email on
        every resend spam attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: >-
            Always returned regardless of whether the email exists or is already
            verified (anti-enumeration).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                msg: "If the email exists and is not yet verified, a verification code has been sent."
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      operationId: refreshAccessToken
      tags: [auth]
      summary: Exchange a valid refresh token for a new access/refresh token pair
      description: >-
        **Changed by OBJ-001 (finding #1).** `verify_refresh_token` enforces
        `type == "refresh"`. Rejection status is `401` for all token-validity
        failures (bad signature, expired, malformed, or wrong `type`). The "valid
        token, but user inactive/deleted" branch stays `400` (a business-state error,
        not a credential-validation failure).

        **Changed by OBJ-002 (finding #3) — refresh tokens now rotate, with reuse
        detection.** Every successful call:

        1. Looks up the submitted token's `jti` claim in the `refresh_sessions`
           table. No row found (includes any pre-OBJ-002 token, which has no `jti`
           at all) → `401`.
        2. Row found but `revoked_at IS NOT NULL` → **reuse detected**: this exact
           token was already exchanged once before and is being replayed. The
           entire token *family* (every row sharing its `family_id`, i.e. every
           descendant issued by prior rotations of the same original login) is
           revoked, and the call fails `401` — same generic message as any other
           failure here, no distinguishing signal. See `obj-002-design-notes.md` §2
           for the full state machine and the rationale for revoking the whole
           family rather than just this token.
        3. Row found, not revoked, but past its own `expires_at` → `401` (ordinary
           expiry, not treated as reuse — no family-wide revocation).
        4. Row valid → the submitted token's `payload.ver` is compared against the
           user's current `token_version` (loaded from the same `User` row this
           handler already fetches for the inactive/not-found check — no extra
           query). Mismatch → `401` (this is the password-reset invalidation path,
           `obj-002-design-notes.md` §3).
        5. All checks pass → the current session row is marked revoked
           (`replaced_by` set to the new row's id), a **new** `refresh_sessions` row
           is inserted (same `family_id`, new `jti`), and a **new** access token +
           **new** refresh token are issued and returned. The submitted refresh
           token cannot be used again after this call succeeds.

        Unlike the pre-OBJ-002 contract, the `refresh_token` in the response is
        **never** the same string that was submitted — callers must persist the
        rotated token and discard the old one immediately.

        **Changed by OBJ-004 (finding #10, informational only):** emits a structured
        `auth.refresh.success`, `auth.refresh.reuse_detected` (logged at `WARNING` —
        this is a possible-token-theft signal), or `auth.refresh.failure` audit-log
        event server-side (user/family/jti identifiers only — never a raw token
        string). No request/response contract change; see `obj-004-design-notes.md`
        §4.

        **Changed by OBJ-005 (finding #11).** Step 4 of the state machine above
        (loaded alongside the existing `is_active`/`token_version` check, same
        query, no extra DB round trip) now also rejects a session whose owning
        user has `is_verified == false` — implements Scenario 2.A.4 (a holder of an
        otherwise-valid refresh token cannot mint a new access token once
        verification is required and not yet satisfied). Same `400` status family
        as the existing inactive-user branch, distinct message. See
        `obj-005-design-notes.md` §3.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: >-
            New access token **and** new (rotated) refresh token issued. The
            submitted refresh token is now revoked and cannot be reused — a repeat
            call with it will be treated as reuse detection (see above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          description: >-
            Token was valid but the associated user is inactive, no longer
            exists, or (OBJ-005) has not yet verified their email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              examples:
                inactive_or_missing:
                  value: { detail: "User inactive or not found" }
                unverified:
                  value: { detail: "Email not verified" }
        '401':
          description: >-
            Token is malformed, has an invalid signature, is expired, has
            `type != "refresh"` (includes an access token being replayed here), has
            no matching (or an already-revoked) `refresh_sessions` row — including
            reuse-detected replays and pre-OBJ-002 legacy tokens with no `jti` — or
            has a `ver` claim that no longer matches the user's current
            `token_version` (invalidated by an intervening password reset). All
            causes share this single generic message and status code — deliberately
            indistinguishable, consistent with this service's existing anti-oracle
            design for OTP/lockout failures. Server-side structured logging (OBJ-004
            scope) SHOULD still record which specific cause fired, for incident
            response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Invalid or expired refresh token"
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh token's session (end that login session)
      description: >-
        **New endpoint, OBJ-002 (finding #3).** Closes the "no `/logout`" gap: a
        stolen refresh token could previously be used for its full natural lifetime
        (`REFRESH_TOKEN_EXPIRE_DAYS`) with no way to cut it off on demand.

        **Changed by OBJ-003 (finding #5, informational only):** a low-severity
        timing side-channel found during OBJ-002's Gate 3 SAST review (this endpoint
        leaked, via response latency, whether the submitted string was a validly-
        signed JWT — independent of session validity, which was already anti-oracled)
        is closed by making the no-signature branch perform an equivalent-shaped
        no-op DB round trip instead of returning immediately. Still always `204`, no
        response-shape change. See `obj-003-design-notes.md` §3.3.

        **What it receives:** the refresh token in the request body — the same
        `RefreshTokenRequest` shape as `/auth/refresh` — **not** the access token
        from the `Authorization` header. Two reasons: (1) nothing is tracked
        per-access-token (access tokens stay fully stateless for latency —
        `obj-002-design-notes.md` §3), so there is no server-side record an access
        token alone could target for revocation; (2) requiring only the refresh
        token lets a client log out even when its access token has already expired
        (the common case of a backgrounded app), matching `/auth/refresh`'s own
        auth model of "possession of the refresh token is the credential," with no
        separate bearer-header requirement layered on top.

        **What it invalidates:** exactly one `refresh_sessions` row — the one whose
        `id` matches the submitted token's `jti` claim — by setting `revoked_at`.
        This does **not** revoke the rest of that token's family (unlike reuse
        detection on `/auth/refresh`): logout is a deliberate, expected client
        action, not an attack signal, so a double-submitted or retried logout call
        must stay a no-op, not cascade into revoking sibling sessions.

        **What it does NOT invalidate:** the caller's current access token, if any.
        Per the stateless-access-token design, an already-issued access token
        remains usable until its own short natural expiry
        (`ACCESS_TOKEN_EXPIRE_MINUTES`) even after logout — this is an accepted,
        explicitly-documented trade-off of not backing access tokens with a
        revocation table (see `obj-002-design-notes.md` §5 open-decisions note).

        **Idempotency — always `204`, deliberately, for any well-formed request
        body:** an already-revoked token, an expired token, a token with no
        matching `refresh_sessions` row (e.g. a pre-OBJ-002 legacy token with no
        `jti`), a malformed/garbage JWT string, or a well-formed JWT of the wrong
        `type` all produce the **same** `204` — because in every one of those cases
        the caller's desired end state ("this token cannot be used to get a new
        session") already holds. Only a request body that fails schema validation
        (missing `refresh_token` field, wrong JSON shape) returns `422`. The
        signature is still cryptographically verified before any DB write is
        attempted — an unverified/attacker-controlled `jti` is never used to look up
        or revoke a row, which would otherwise let a forged token be used to log out
        an arbitrary other session by guessing its id.

        **Changed by OBJ-004 (finding #10, informational only):** emits a structured
        `auth.logout` audit-log event server-side (`jti` when present, IP — never a
        raw token string). No request/response contract change; see
        `obj-004-design-notes.md` §4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: >-
            The session is now revoked (or already was, already expired, never
            existed, or the token was malformed/wrong-type) — idempotent success in
            every case. No response body.
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated user (proposed — see design notes §5)
      description: >-
        **New endpoint proposed as part of OBJ-001, not yet in `auth.py`.** Today
        `deps.get_current_user` has zero real consumers, which means finding #1's
        fix (rejecting a refresh token used as a Bearer access token) has no HTTP
        surface to contract-test end-to-end. This minimal protected endpoint gives
        `qa-engineer` a concrete target for that regression test and gives every
        project forking this template a canonical "protected route" example. Flagged
        for explicit confirmation — see final summary.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: >-
            Missing/malformed `Authorization` header, invalid signature, expired
            token, missing `sub`, unknown user, `type != "access"` (finding #1's
            fail-closed fix — a refresh token presented here is rejected with this
            same generic message), **or (OBJ-002) `ver` claim not equal to the
            user's current `token_version`** — this last case means the access
            token was issued before the user's most recent password reset and is
            treated as invalidated even though it hasn't naturally expired yet. All
            causes share the identical generic message, per this service's existing
            anti-oracle design.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
              example:
                detail: "Could not validate credentials"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token only. `app/api/deps.get_current_user` decodes the token and
        rejects it (401) unless the `type` claim is exactly `"access"` — a refresh
        token is fail-closed rejected here, never accepted as a substitute (audit
        finding #1). See `obj-001-design-notes.md` §1 for the full claim schema.
        As of OBJ-002, the same handler also compares the token's `ver` claim
        against the user's current `token_version` (loaded as part of the same DB
        read already required to fetch the `User` row — no extra query) and
        rejects on mismatch; see `obj-002-design-notes.md` §3. Access tokens are
        deliberately **not** checked against any session/revocation table — they
        stay fully stateless for latency, backed only by their short natural
        expiry and this `ver` check.

  responses:
    ValidationError:
      description: Request body failed schema validation (Pydantic)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'

    RateLimited:
      description: >-
        Too many requests from this client (IP-based). Distinct from, and unrelated
        to, OTP attempt lockout — see design notes §2 for why these two mechanisms are
        kept separate.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: "Too many requests. Please try again later."

  schemas:
    UserCreate:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            Must contain at least one uppercase letter, one digit, and one special
            character (`!@#$%^&*()_+-=[]{}|;':",./<>?`). Enforced by
            `validate_password_strength` (unchanged by OBJ-001).

    UserResponse:
      type: object
      required: [id, email, is_active, is_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_active:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      description: Never includes `hashed_password` (audit-confirmed PASS, unchanged).

    LoginForm:
      type: object
      required: [username, password]
      description: OAuth2 password-grant form (`OAuth2PasswordRequestForm`, unchanged).
      properties:
        grant_type:
          type: string
          enum: ["password"]
          nullable: true
        username:
          type: string
          format: email
          description: The user's email, despite the OAuth2 field name `username`.
        password:
          type: string
        scope:
          type: string
          default: ""
        client_id:
          type: string
          nullable: true
        client_secret:
          type: string
          nullable: true

    Token:
      type: object
      required: [access_token, token_type, refresh_token]
      properties:
        access_token:
          type: string
          description: >-
            JWT with claims `{sub, exp, iat, type: "access", ver}`. `ver` (OBJ-002)
            is the user's `token_version` at issuance time — see
            `obj-002-design-notes.md` §3. Never carries a `jti`; access tokens are
            not tracked in any persistence table.
        token_type:
          type: string
          enum: ["bearer"]
        refresh_token:
          type: string
          description: >-
            JWT with claims `{sub, exp, iat, type: "refresh", ver, jti}`. `jti`
            (OBJ-002) is the primary key of this token's row in the
            `refresh_sessions` table; `ver` is the user's `token_version` at
            issuance time. From `/auth/login` this seeds a new session family; from
            `/auth/refresh` this is a freshly rotated token in the same family as
            the one submitted — never the same string that was submitted. See
            `obj-002-design-notes.md` §1-3.

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      description: >-
        Shared request shape for `/auth/refresh` and `/auth/logout` (OBJ-002) — both
        endpoints authenticate the caller purely via possession of a valid refresh
        token, with no separate `Authorization` header requirement.
      properties:
        refresh_token:
          type: string

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    OTPVerifyRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'

    PasswordResetRequest:
      type: object
      required: [email, otp, new_password]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: Same strength rule as `UserCreate.password`.

    MessageResponse:
      type: object
      required: [msg]
      properties:
        msg:
          type: string

    HTTPError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
      description: Standard FastAPI `HTTPException` shape, used for every non-2xx, non-422 error.

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
      description: Standard FastAPI/Pydantic 422 shape (unchanged).
